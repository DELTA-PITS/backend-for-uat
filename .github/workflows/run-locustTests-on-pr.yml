# TODO: Ensure that the /api/v1/register and /api/v1/verify endpoints work as expected in the action,
# abnormally high fail percentage.

# TODO: Make result report match exactly with Locusts output when ran via CMD.

name: Run all locust end-to-end tests
on: push

# This action uses the following locust documentation as reference:
# https://docs.locust.io/en/stable/running-without-web-ui.html#running-in-ci-cd
jobs:
  end-to-end-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and run application
        env:
          # App
          EXPOSE_PORT: 41012
          BUILD_DATE: 2026-06-04
          CORS_ALLOW_ORIGINS: http://localhost:3000
          BASE_DIR: /home/runner/work/V2-Backend/V2-Backend/

          # PostgreSQL
          POSTGRES_PORT: 5432
          POSTGRES_DB: trustmark
          POSTGRES_USER: trustmark
          POSTGRES_PASSWORD: trustmark

          # Keycloak
          KEYCLOAK_USER: admin
          KEYCLOAK_PASS: admin
          KEYCLOAK_ISSUER: http://localhost:8080/realms/nextjs-kc
          KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/nextjs-kc

          # blockchain
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:8545
          BLOCKCHAIN_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

          # Test mode (bypasses authentication)
          TEST_MODE: True
        run: |
          cp .github/docker/.env.example .github/docker/.env
          sed -i "s/TEST_MODE=.*/TEST_MODE=${TEST_MODE}/" .github/docker/.env
          docker compose --env-file .github/docker/.env -f .github/docker/docker-compose.yml up --build --detach
          echo "Waiting for containers to start..."
          sleep 5
      - name: Wait for application to be ready
        run: |
          echo "Checking if application is ready..."
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -s http://127.0.0.1:41012/api/v1/health > /dev/null 2>&1; then
              echo "✅ Application is ready!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Application not ready yet (attempt $attempt/$max_attempts), checking again..."
            sleep 2
          done
          echo "❌ Application failed to become ready after 120 seconds"
          echo "Capturing container logs for diagnostics..."
          echo ""
          echo "=== trustmark-app logs ==="
          docker logs trustmark-app || echo "Failed to get app logs"
          echo ""
          echo "=== Docker compose ps ==="
          docker compose -f .github/docker/docker-compose.yml ps || echo "Failed to get compose status"
          exit 1
      - name: Install & run Locust
        # Locust tests take 70 seconds + 20 second margin = 90 seconds total
        run: |
          set -e
          set -o pipefail
          pip install --upgrade pip

          echo "Installing project dependencies..."
          pip install -e .

          echo "Installing Locust..."
          pip install locust

          echo "Starting Locust tests..."
          locust_output=$(locust --config tests/trustmark/locust/locust.conf 2>&1 || true)
          echo "$locust_output"

          # Check for failures in locust output
          if echo "$locust_output" | grep -iE "(failed|error|exception|failure rate.*>.*0)" > /dev/null; then
            echo "❌ Locust tests detected failures!"
            exit 1
          fi

          # Also check if locust didn't report any stats (which indicates a problem)
          if ! echo "$locust_output" | grep -E "(requests|failure|response)" > /dev/null; then
            echo "❌ Locust failed to generate test results!"
            exit 1
          fi

          echo "✅ Locust tests completed successfully"
      - name: Report Locust Performance Results
        if: always()
        run: |
          echo "====================================="
          echo "📊 LOCUST PERFORMANCE TEST RESULTS"
          echo "====================================="

          if [ -f tests/trustmark/locust/logs/locust.log ]; then
            echo ""
            echo "📈 Test Statistics:"
            echo "-------------------"
            grep -E "(request|failure|response time|user count)" tests/trustmark/locust/logs/locust.log | tail -50 || echo "No statistics available"
            
            echo ""
            echo "🔍 Test Summary:"
            echo "----------------"
            tail -100 tests/trustmark/locust/logs/locust.log || echo "No log file"
          else
            echo "⚠️  Locust log file not found at tests/trustmark/locust/logs/locust.log"
          fi
          echo "====================================="
      - name: Stop application services
        if: always()
        run: docker compose --env-file .github/docker/.env -f .github/docker/docker-compose.yml down
