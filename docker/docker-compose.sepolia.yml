# TEMPLATE for the Ethereum Sepolia public rehearsal (Phase 2). NOT part of the default stack and
# NOT deployed by Phase 1: it is only used when passed explicitly.
#
#   CURRENT PRODUCTION                    REHEARSAL (this file)
#   trustmark-app                         trustmark-app-sepolia
#   +- Postgres DB: trustmark             +- Postgres DB: trustmark_sepolia   (own database)
#   +- Anvil, chain 31337                 +- Ethereum Sepolia, chain 11155111 (remote RPC provider)
#
# The Anvil backend (`trustmark-app`) and the `anvil` service are untouched. There is NO Sepolia node
# container: Sepolia is a remote public chain reached over HTTPS via a managed RPC provider.
#
# Database separation is explicit and has no fallback to production:
#   * the database name is written literally in DATABASE_URL (no variable that could default to `trustmark`);
#   * REQUIRE_DATABASE_NAME makes the app refuse to start if DATABASE_URL ever points anywhere else;
#   * SCHEMA_AUTO_APPLY is false: the schema is created by an explicit migrate step (below).
#
# Required in the server-side .env (never committed): SEPOLIA_RPC_URL, SEPOLIA_PRIVATE_KEY.
#
# One-time preparation (after a backup; none of it touches the `trustmark` database):
#   docker compose exec postgres psql -U ${POSTGRES_USER:-trustmark} -c "CREATE DATABASE trustmark_sepolia"
#   docker compose -f docker-compose.yml -f docker-compose.sepolia.yml run --rm --no-deps trustmark-app-sepolia \
#       python -m trustmark.infra.schema migrate
#   docker compose -f docker-compose.yml -f docker-compose.sepolia.yml run --rm --no-deps trustmark-app-sepolia \
#       python -m trustmark.infra.schema check
# Start:
#   docker compose -f docker-compose.yml -f docker-compose.sepolia.yml up -d --build trustmark-app-sepolia

services:
  trustmark-app-sepolia:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      BASE_DIR: /home/akmi/pits
      EXPOSE_PORT: 41012
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/nextjs-kc}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trustmark}:${POSTGRES_PASSWORD:-trustmark}@postgres:5432/trustmark_sepolia
      REQUIRE_DATABASE_NAME: trustmark_sepolia
      SCHEMA_AUTO_APPLY: "false"
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-account}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      BLOCKCHAIN_RPC_URL: ${SEPOLIA_RPC_URL:?set SEPOLIA_RPC_URL in the server .env}
      BLOCKCHAIN_PRIVATE_KEY: ${SEPOLIA_PRIVATE_KEY:?set SEPOLIA_PRIVATE_KEY in the server .env}
      BLOCKCHAIN_CHAIN_ID: "11155111"
      BLOCKCHAIN_NETWORK_NAME: "Ethereum Sepolia"
      BLOCKCHAIN_EXPLORER_URL: "https://sepolia.etherscan.io"
      BLOCKCHAIN_RECEIPT_TIMEOUT_SECONDS: "45"
      BLOCKCHAIN_CONFIRMATIONS: "1"
      TEST_MODE: "False"
    ports:
      - "127.0.0.1:${SEPOLIA_EXPOSE_PORT:-41013}:41012"
    restart: unless-stopped
